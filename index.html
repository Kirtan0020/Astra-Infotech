<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06070d" />
    <!-- description, Open Graph, and Twitter tags are injected per-route by
         src/components/Seo.jsx (react-helmet-async) — kept out of here to
         avoid duplicate meta tags fighting the per-page ones. -->
    <title>Astra Infotech — Design & Development Studio</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Static, dependency-free preloader — shown instantly (before the JS
         bundle/app CSS load) and removed once React has mounted, so there's
         never a blank flash while fonts/JS/content are still loading. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06070d;
        transition: opacity 0.4s ease;
      }
      html[data-theme='light'] #preloader {
        background: #f5f6fa;
      }
      #preloader .preloader-visual {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #preloader .preloader-ring {
        position: absolute;
        inset: 0;
        border-radius: 9999px;
        border: 1px dashed rgba(139, 92, 246, 0.35);
        animation: preloader-spin 6s linear infinite;
      }
      #preloader .preloader-ring-inner {
        position: absolute;
        inset: 21px;
        border-radius: 9999px;
        border: 1px solid rgba(79, 110, 247, 0.3);
        animation: preloader-spin 4.5s linear infinite reverse;
      }
      /* Orbit tracks: each is a rotating square that carries one dot at its
         top edge, same trick as the Home hero's orbit visual — the dot
         traces a circle as its parent spins. */
      #preloader .preloader-orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 9999px;
      }
      #preloader .preloader-orbit-1 {
        width: 140px;
        height: 140px;
        margin: -70px 0 0 -70px;
        animation: preloader-spin 3.6s linear infinite;
      }
      #preloader .preloader-orbit-2 {
        width: 98px;
        height: 98px;
        margin: -49px 0 0 -49px;
        animation: preloader-spin 2.6s linear infinite reverse;
      }
      #preloader .preloader-orbit-3 {
        width: 66px;
        height: 66px;
        margin: -33px 0 0 -33px;
        animation: preloader-spin 1.9s linear infinite;
      }
      #preloader .preloader-dot {
        position: absolute;
        top: 0;
        left: 50%;
        border-radius: 9999px;
        transform: translate(-50%, -50%);
      }
      #preloader .preloader-orbit-1 .preloader-dot {
        width: 9px;
        height: 9px;
        background: #6ea8fe;
        box-shadow: 0 0 10px 2px rgba(79, 110, 247, 0.9);
      }
      #preloader .preloader-orbit-2 .preloader-dot {
        width: 7px;
        height: 7px;
        background: #b6a5ff;
        box-shadow: 0 0 10px 2px rgba(139, 92, 246, 0.9);
      }
      #preloader .preloader-orbit-3 .preloader-dot {
        width: 6px;
        height: 6px;
        background: #f0abfc;
        box-shadow: 0 0 8px 2px rgba(214, 178, 255, 0.9);
      }
      #preloader .preloader-glow {
        position: absolute;
        inset: 27px;
        border-radius: 9999px;
        background: radial-gradient(circle, #6c63ff 0%, #8b5cf6 55%, transparent 75%);
        animation: preloader-glow 1.6s ease-in-out infinite;
      }
      #preloader img {
        position: relative;
        width: 52px;
        height: 52px;
        animation: preloader-bob 1.6s ease-in-out infinite;
        filter: drop-shadow(0 8px 20px rgba(108, 99, 255, 0.5));
      }
      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes preloader-glow {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.9);
        }
        50% {
          opacity: 0.85;
          transform: scale(1.08);
        }
      }
      @keyframes preloader-bob {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-6px) scale(1.05);
        }
      }
      #preloader.preloader-hidden {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .preloader-ring,
        #preloader .preloader-ring-inner,
        #preloader .preloader-orbit-1,
        #preloader .preloader-orbit-2,
        #preloader .preloader-orbit-3,
        #preloader .preloader-glow,
        #preloader img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div class="preloader-visual">
        <div class="preloader-ring"></div>
        <div class="preloader-ring-inner"></div>
        <div class="preloader-orbit preloader-orbit-1"><span class="preloader-dot"></span></div>
        <div class="preloader-orbit preloader-orbit-2"><span class="preloader-dot"></span></div>
        <div class="preloader-orbit preloader-orbit-3"><span class="preloader-dot"></span></div>
        <div class="preloader-glow"></div>
        <img src="/logo.png" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

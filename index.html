<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06070d" />
    <!-- description, Open Graph, and Twitter tags are injected per-route by
         src/components/Seo.jsx (react-helmet-async) — kept out of here to
         avoid duplicate meta tags fighting the per-page ones. -->
    <title>Astra Infotech — Design & Development Studio</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Static, dependency-free preloader — shown instantly (before the JS
         bundle/app CSS load) and removed once React has mounted, so there's
         never a blank flash while fonts/JS/content are still loading. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #06070d;
        transition: opacity 0.4s ease;
      }
      html[data-theme='light'] #preloader {
        background: #f5f6fa;
      }
      #preloader img {
        width: 56px;
        height: 56px;
        animation: preloader-pulse 1.1s ease-in-out infinite;
      }
      @keyframes preloader-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.86);
          opacity: 0.6;
        }
      }
      #preloader.preloader-hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="preloader"><img src="/logo.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # dist/ is fully reproducible from source, so --delete keeps old JS/CSS
      # bundle hashes from piling up. uploads/ is EXCLUDED on purpose — it
      # only exists on the server (real media-library uploads), never in dist/.
      - name: Deploy frontend
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" sftp://$FTP_HOST:22 -e "
            set sftp:auto-confirm yes;
            mirror -R --delete --verbose --exclude-glob uploads/ dist/ /public_html/;
            bye
          "

      # No --delete here: api/config.php lives only on the server (gitignored,
      # never checked out in CI) and must never be removed by this step.
      - name: Deploy backend
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" sftp://$FTP_HOST:22 -e "
            set sftp:auto-confirm yes;
            mirror -R --verbose api/ /public_html/api/;
            bye
          "

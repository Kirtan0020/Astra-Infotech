name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # dist/ is fully reproducible from source, so --delete keeps old JS/CSS
      # bundle hashes from piling up. uploads/ is EXCLUDED on purpose — it
      # only exists on the server (real media-library uploads), never in dist/.
      #
      # Plain FTP on 21, not SFTP on 22 — this Hostinger plan doesn't expose
      # SSH/SFTP, so lftp would hang indefinitely waiting on a handshake that
      # never completes (see .vscode/sftp.json / DEPLOY.md, the proven-working
      # manual deploy path). The outer `timeout` plus lftp's own net:timeout
      # are a backstop so a future connectivity issue fails fast instead of
      # hanging for the job's full 6-hour default.
      #
      # Sequential, one lftp session at a time, on purpose — tried running
      # frontend+backend as two concurrent lftp sessions to speed this up,
      # but this Hostinger FTP account only allows one connection at a time:
      # both sessions hit "max-retries exceeded" when run in parallel.
      - name: Deploy frontend
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" ftp://$FTP_HOST:21 -e "
            set ftp:ssl-allow no;
            set net:timeout 15;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set cmd:fail-exit yes;
            mirror -R --delete --verbose --exclude-glob uploads/ dist/ /public_html/;
            bye
          "

      # No --delete here: api/config.php lives only on the server (gitignored,
      # never checked out in CI) and must never be removed by this step.
      - name: Deploy backend
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" ftp://$FTP_HOST:21 -e "
            set ftp:ssl-allow no;
            set net:timeout 15;
            set net:max-retries 2;
            set net:reconnect-interval-base 5;
            set cmd:fail-exit yes;
            mirror -R --verbose api/ /public_html/api/;
            bye
          "
